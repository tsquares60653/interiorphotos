<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T. Thompson - Quantum Lab Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0e27; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0e27;
        }

        .space-view {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            z-index: 10;
            position: relative;
        }

        .artwork-card {
            background: rgba(26, 58, 90, 0.9);
            border: 2px solid #00d9ff;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .artwork-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.4);
            border-color: #00ffff;
        }

        .artwork-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a3a5a, #0f2540);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d9ff;
            font-size: 48px;
            font-weight: bold;
        }

        .artwork-info {
            padding: 16px;
            background: rgba(15, 22, 40, 0.95);
        }

        .artwork-title {
            font-size: 14px;
            font-weight: 600;
            color: #00d9ff;
            margin-bottom: 8px;
        }

        .artwork-detail {
            font-size: 12px;
            color: #a0a0b0;
            line-height: 1.5;
        }

        .controls {
            padding: 20px;
            background: rgba(10, 14, 39, 0.95);
            border-top: 1px solid #404050;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid #00d9ff;
            color: #00d9ff;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(0, 217, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .space-label {
            font-size: 13px;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 14, 39, 0.9);
            border: 1px solid #404050;
            padding: 16px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #a0a0b0;
            max-width: 280px;
            z-index: 100;
        }

        .hud-title {
            color: #00d9ff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hud-item {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="space-view" id="spaceView"></div>
        
        <div class="controls">
            <div class="space-label" id="spaceName">Lobby Entrance</div>
            
            <div class="nav-buttons">
                <button id="prevBtn" onclick="previousSpace()">← Previous</button>
                <button id="nextBtn" onclick="nextSpace()">Next →</button>
            </div>
            
            <div style="font-size: 12px; color: #00d9ff;">
                <span id="spaceCounter">1</span> / <span id="spaceTotal">6</span>
            </div>
        </div>
    </div>

    <div class="hud">
        <div class="hud-title">&gt; QUANTUM LAB GALLERY</div>
        <div class="hud-item">T. Thompson Photography</div>
        <div class="hud-item" style="margin-top: 10px; border-top: 1px solid #404050; padding-top: 8px;">
            Click artworks to explore
        </div>
    </div>

    <script>
        const spaces = [
            {
                name: "Lobby Entrance",
                bgImage: "linear-gradient(135deg, #1a2f4a 0%, #0f1628 100%)",
                artworks: [
                    { id: 1, title: "Photograph I", detail: "Travel Study - Hasselblad 500C/M" },
                    { id: 2, title: "Photograph II", detail: "Kodak Portra 400 - Pentax 67II" },
                    { id: 3, title: "Photograph III", detail: "Fujicolor Velvia - Medium Format" },
                    { id: 4, title: "Photograph IV", detail: "Kodak Tri-X - 35mm Study" }
                ]
            },
            {
                name: "Corridor West",
                bgImage: "linear-gradient(135deg, #0f1628 0%, #1a2f4a 100%)",
                artworks: [
                    { id: 3, title: "Photograph III", detail: "Fujicolor Velvia - Medium Format" },
                    { id: 4, title: "Photograph IV", detail: "Kodak Tri-X - 35mm Study" }
                ]
            },
            {
                name: "Gallery Space One",
                bgImage: "linear-gradient(135deg, #1a3a5a 0%, #0f1628 100%)",
                artworks: [
                    { id: 1, title: "Photograph I", detail: "Travel Study - Hasselblad 500C/M" },
                    { id: 2, title: "Photograph II", detail: "Kodak Portra 400 - Pentax 67II" }
                ]
            },
            {
                name: "Corridor East",
                bgImage: "linear-gradient(135deg, #0f2540 0%, #1a2a4a 100%)",
                artworks: [
                    { id: 5, title: "Photograph V", detail: "Pentax 67II - Color Study" },
                    { id: 6, title: "Photograph VI", detail: "Leica M6 - Black & White" }
                ]
            },
            {
                name: "Gallery Space Two",
                bgImage: "linear-gradient(135deg, #1a2f4a 0%, #0f3040 100%)",
                artworks: [
                    { id: 5, title: "Photograph V", detail: "Pentax 67II - Color Study" },
                    { id: 6, title: "Photograph VI", detail: "Leica M6 - Black & White" }
                ]
            },
            {
                name: "Exhibition Hall",
                bgImage: "linear-gradient(135deg, #0f1628 0%, #1a3a5a 100%)",
                artworks: [
                    { id: 1, title: "Photograph I", detail: "Travel Study - Hasselblad 500C/M" },
                    { id: 2, title: "Photograph II", detail: "Kodak Portra 400 - Pentax 67II" },
                    { id: 3, title: "Photograph III", detail: "Fujicolor Velvia - Medium Format" },
                    { id: 4, title: "Photograph IV", detail: "Kodak Tri-X - 35mm Study" },
                    { id: 5, title: "Photograph V", detail: "Pentax 67II - Color Study" },
                    { id: 6, title: "Photograph VI", detail: "Leica M6 - Black & White" }
                ]
            }
        ];

        let currentSpace = 0;

        function loadSpace(index) {
            const space = spaces[index];
            const view = document.getElementById('spaceView');
            view.style.backgroundImage = space.bgImage;
            document.getElementById('spaceName').textContent = space.name;
            document.getElementById('spaceCounter').textContent = index + 1;
            document.getElementById('spaceTotal').textContent = spaces.length;

            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === spaces.length - 1;

            const grid = document.querySelector('.artwork-grid') || document.createElement('div');
            grid.className = 'artwork-grid';
            grid.innerHTML = '';

            space.artworks.forEach(art => {
                const card = document.createElement('div');
                card.className = 'artwork-card';
                card.innerHTML = `
                    <div class="artwork-image">
                        ${art.id}
                    </div>
                    <div class="artwork-info">
                        <div class="artwork-title">${art.title}</div>
                        <div class="artwork-detail">${art.detail}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (!document.querySelector('.artwork-grid')) {
                view.appendChild(grid);
            }
        }

        function nextSpace() {
            if (currentSpace < spaces.length - 1) {
                currentSpace++;
                loadSpace(currentSpace);
            }
        }

        function previousSpace() {
            if (currentSpace > 0) {
                currentSpace--;
                loadSpace(currentSpace);
            }
        }

        loadSpace(0);
    </script>
</body>
</html>
