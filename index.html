<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSI Quantum Lab Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e27; overflow: hidden; font-family: 'Courier New', monospace; }
        #canvas { display: block; width: 100%; height: 100vh; }
        #hud { position: absolute; bottom: 20px; left: 20px; color: #e0e0e0; font-size: 12px; background: rgba(10, 14, 39, 0.85); padding: 16px; border: 1px solid #404050; border-radius: 4px; max-width: 280px; }
        #hud-title { margin-bottom: 10px; color: #00d9ff; font-weight: bold; }
        .command { font-size: 11px; line-height: 1.6; color: #a0a0b0; margin-bottom: 8px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <div id="hud-title">&gt; PSI QUANTUM LAB</div>
        <div class="command">W/A/S/D — Navigate</div>
        <div class="command">MOUSE — Look around</div>
        <div class="command">CLICK — Interact</div>
        <div style="margin-top: 10px; border-top: 1px solid #404050; padding-top: 8px; opacity: 0.7;">Photonic Chipset Gallery</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        const keys = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, -12);
            
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            
            const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 40, 30);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            const accentLight = new THREE.PointLight(0x00d9ff, 0.3);
            accentLight.position.set(-15, 10, 5);
            scene.add(accentLight);

            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1f3a, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(100, 20, 0x00d9ff, 0x1a2a4a);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f1628, roughness: 0.8 });
            
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 18), wallMat);
            backWall.position.set(0, 9, -10);
            backWall.receiveShadow = true;
            scene.add(backWall);
            
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 18), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-18, 9, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 18), wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(18, 9, 0);
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            const hallLeftWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 18), wallMat);
            hallLeftWall.rotation.y = Math.PI / 2;
            hallLeftWall.position.set(-18, 9, 25);
            hallLeftWall.receiveShadow = true;
            scene.add(hallLeftWall);
            
            const hallRightWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 18), wallMat);
            hallRightWall.rotation.y = -Math.PI / 2;
            hallRightWall.position.set(18, 9, 25);
            hallRightWall.receiveShadow = true;
            scene.add(hallRightWall);

            const lobbyFrames = [
                { pos: [-10, 2, -9.8], size: [4, 4], color: 0x1a3a5a },
                { pos: [-2, 2, -9.8], size: [4, 4], color: 0x1a3a5a },
                { pos: [6, 2, -9.8], size: [4, 4], color: 0x1a3a5a },
                { pos: [14, 2, -9.8], size: [4, 4], color: 0x1a3a5a }
            ];

            lobbyFrames.forEach((frame) => {
                const geo = new THREE.PlaneGeometry(frame.size[0], frame.size[1]);
                const mat = new THREE.MeshStandardMaterial({ color: frame.color, metalness: 0.3 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...frame.pos);
                mesh.castShadow = true;
                scene.add(mesh);

                const borderGeo = new THREE.BoxGeometry(frame.size[0] + 0.3, frame.size[1] + 0.3, 0.1);
                const borderMat = new THREE.MeshStandardMaterial({ color: 0x00d9ff, metalness: 0.8 });
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.copy(mesh.position);
                border.position.z -= 0.08;
                scene.add(border);
            });

            const hallFrames = [
                { pos: [-10, 2, 25], size: [3.5, 3.5], color: 0x1a3a5a },
                { pos: [10, 2, 25], size: [3.5, 3.5], color: 0x1a3a5a }
            ];

            hallFrames.forEach((frame) => {
                const geo = new THREE.PlaneGeometry(frame.size[0], frame.size[1]);
                const mat = new THREE.MeshStandardMaterial({ color: frame.color, metalness: 0.3 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...frame.pos);
                mesh.castShadow = true;
                scene.add(mesh);

                const borderGeo = new THREE.BoxGeometry(frame.size[0] + 0.3, frame.size[1] + 0.3, 0.1);
                const borderMat = new THREE.MeshStandardMaterial({ color: 0x00d9ff, metalness: 0.8 });
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.copy(mesh.position);
                border.position.z -= 0.08;
                scene.add(border);
            });

            setupControls();
            animate();
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
            
            let locked = false;
            document.addEventListener('click', () => document.body.requestPointerLock?.());
            document.addEventListener('pointerlockchange', () => locked = !!document.pointerLockElement);
            
            document.addEventListener('mousemove', (e) => {
                if (!locked) return;
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.setFromQuaternion(camera.quaternion);
                euler.rotateY(-e.movementX * 0.003);
                euler.rotateX(-e.movementY * 0.003);
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const vec = new THREE.Vector3();
            if (keys['w']) vec.z -= 1;
            if (keys['s']) vec.z += 1;
            if (keys['a']) vec.x -= 1;
            if (keys['d']) vec.x += 1;
            
            vec.normalize();
            vec.applyQuaternion(camera.quaternion);
            camera.position.addScaledVector(vec, 0.18);
            camera.position.y = Math.max(1.5, camera.position.y);
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
