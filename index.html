<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Portfolio</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const { ChevronRight, ChevronLeft, X } = lucide;

        function VirtualGalleryWalk() {
          const [currentRoom, setCurrentRoom] = useState(0);
          const [selectedArtwork, setSelectedArtwork] = useState(null);

          const rooms = [
            {
              id: 0,
              name: "Suite Entrance",
              location: "",
              description: "You enter a serene suite foyer. Soft natural light spills across marble floors.",
              bgColor: "#faf8f5",
              artworks: [
                {
                  id: "a1",
                  title: "Machu Picchu at Sunrise",
                  film: "Hasselblad 500C/M - Fujicolor Pro",
                  position: "center-wall-main",
                  x: 50,
                  y: 35,
                  width: 300,
                  height: 400,
                  narrative: "This monumental travel study anchors the entrance. Guests pause here—the misty Andean light creates an immediate sense of discovery and wonder, setting the tone for the entire space experience.",
                  placement: "Primary focal point above console table",
                  scale: "60\" × 40\""
                }
              ]
            },
            {
              id: 1,
              name: "Master Bedroom",
              location: "",
              description: "You step into the bedroom. Soft light from floor-to-ceiling windows illuminates the space. Your travel photograph commands the wall above the bed.",
              bgColor: "#fdf9f6",
              artworks: [
                {
                  id: "a2",
                  title: "Venice Waterways",
                  film: "Pentax 67II - Kodak Portra 400",
                  position: "bed-wall-main",
                  x: 50,
                  y: 40,
                  width: 320,
                  height: 240,
                  narrative: "A meditative presence above the bed. The soft, reflected light of Venetian canals becomes the first thing guests see upon waking—a daily reminder of beauty and travel's transformative power.",
                  placement: "Above bed, subtle matting in natural linen",
                  scale: "64\" × 48\""
                },
                {
                  id: "a3",
                  title: "Tokyo Neon Rain",
                  film: "Leica M6 - Kodak Tri-X",
                  position: "side-wall",
                  x: 20,
                  y: 50,
                  width: 200,
                  height: 200,
                  narrative: "A smaller companion piece on the side wall. This urban study provides visual contrast—vibrant where the bed wall is serene. The film grain and color capture a different mood entirely.",
                  placement: "Gallery corner, framed simply",
                  scale: "32\" × 32\""
                }
              ]
            },
            {
              id: 2,
              name: "Dining Room",
              location: "",
              description: "You move into the dining area. Elegant tables are set beneath soft pendant lighting. Your travel photographs frame the room.",
              bgColor: "#faf8f5",
              artworks: [
                {
                  id: "a4",
                  title: "Moroccan Bazaar",
                  film: "Hasselblad 500C/M - Fujicolor Velvia",
                  position: "accent-wall-left",
                  x: 15,
                  y: 30,
                  width: 280,
                  height: 280,
                  narrative: "This warm, spice-toned travel image hangs on the accent wall. Diners are submerged in color and texture—each course becomes a journey. The photograph transforms the meal into an experience.",
                  placement: "Feature wall, gallery-style grouping",
                  scale: "56\" × 56\""
                },
                {
                  id: "a5",
                  title: "Tuscan Landscape",
                  film: "Pentax 67II - Fujicolor Pro",
                  position: "accent-wall-right",
                  x: 85,
                  y: 30,
                  width: 280,
                  height: 210,
                  narrative: "Balancing the room's composition. Rolling hills and golden light echo the restaurant's culinary philosophy—seasonal, natural, deeply rooted in place.",
                  placement: "Opposite wall, matching scale and treatment",
                  scale: "56\" × 42\""
                }
              ]
            },
            {
              id: 3,
              name: "Private Lounge",
              location: "",
              description: "You step into the lounge. It's intimate, sophisticated. A single powerful photograph dominates the space.",
              bgColor: "#fdf9f6",
              artworks: [
                {
                  id: "a6",
                  title: "Japanese Temple Garden",
                  film: "Hasselblad 500C/M - Kodak Portra 160",
                  position: "lounge-wall-main",
                  x: 50,
                  y: 35,
                  width: 340,
                  height: 450,
                  narrative: "A monumental work. Private diners and executives sit beneath this serene study—a moment of contemplation in the midst of business and celebration. The composition invites stillness.",
                  placement: "Primary wall, salon-style framing",
                  scale: "68\" × 48\""
                }
              ]
            },
            {
              id: 4,
              name: "Living Room",
              location: "",
              description: "You enter a light-filled room. Floor-to-ceiling windows overlook the landscape. Your travel photography is perfectly positioned against the architecture.",
              bgColor: "#faf8f5",
              artworks: [
                {
                  id: "a7",
                  title: "Icelandic Black Sand Beach",
                  film: "Pentax 67II - Kodak Portra 400",
                  position: "living-room-main",
                  x: 50,
                  y: 40,
                  width: 320,
                  height: 240,
                  narrative: "A dramatic moody landscape anchors the seating area. Its dark, contemplative tones provide visual depth against the bright light. The work grows more powerful as the sun shifts throughout the day.",
                  placement: "Above sofa, dramatic scale",
                  scale: "64\" × 48\""
                }
              ]
            },
            {
              id: 5,
              name: "Study",
              location: "",
              description: "You move into the office. Bookshelves line the walls. A curated collection of travel photographs creates a gallery of inspiration.",
              bgColor: "#fdf9f6",
              artworks: [
                {
                  id: "a8",
                  title: "Peruvian Mountain Village",
                  film: "Leica M6 - Fujicolor Pro",
                  position: "study-wall-left",
                  x: 25,
                  y: 45,
                  width: 240,
                  height: 240,
                  narrative: "A smaller intimate work among the books. This photograph speaks to curiosity and worldliness—the owner's passions reflected in both reading and collecting.",
                  placement: "Gallery wall arrangement",
                  scale: "48\" × 48\""
                },
                {
                  id: "a9",
                  title: "Seoul at Night",
                  film: "Hasselblad 500C/M - Fujicolor Velvia",
                  position: "study-wall-right",
                  x: 75,
                  y: 45,
                  width: 220,
                  height: 220,
                  narrative: "Urban energy contrasts with the mountain village. Together, these pieces tell a story of a well-traveled life—both contemplative and engaged with the world.",
                  placement: "Complementary piece, gallery arrangement",
                  scale: "44\" × 44\""
                }
              ]
            }
          ];

          const currentRoomData = rooms[currentRoom];
          
          const handleNextRoom = () => {
            if (currentRoom < rooms.length - 1) {
              setCurrentRoom(currentRoom + 1);
              setSelectedArtwork(null);
            }
          };

          const handlePrevRoom = () => {
            if (currentRoom > 0) {
              setCurrentRoom(currentRoom - 1);
              setSelectedArtwork(null);
            }
          };

          return (
            <div style={{ fontFamily: 'system-ui, -apple-system, sans-serif', backgroundColor: '#fafaf8', minHeight: '100vh' }}>
              <style>{`
                @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap');

                * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                }

                body {
                  background: #fafaf8;
                }

                .gallery-container {
                  display: flex;
                  height: 100vh;
                  background: #fafaf8;
                }

                .viewer-section {
                  flex: 1;
                  display: flex;
                  flex-direction: column;
                  position: relative;
                  overflow: hidden;
                }

                .room-view {
                  flex: 1;
                  position: relative;
                  overflow: hidden;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                }

                .room-canvas {
                  width: 100%;
                  height: 100%;
                  position: relative;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  perspective: 1000px;
                }

                .room-background {
                  position: absolute;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #ccc;
                  font-size: 18px;
                  font-style: italic;
                  overflow: hidden;
                }

                .room-background::before {
                  content: '';
                  position: absolute;
                  top: 0;
                  left: 0;
                  right: 0;
                  height: 50%;
                  background: linear-gradient(180deg, #e8e3de 0%, #d9d0c8 100%);
                  z-index: 0;
                }

                .room-background::after {
                  content: '';
                  position: absolute;
                  bottom: 0;
                  left: 0;
                  right: 0;
                  height: 50%;
                  background: linear-gradient(180deg, #f5ede4 0%, #ebe3da 100%);
                  z-index: 0;
                }

                .room-space {
                  position: absolute;
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  z-index: 1;
                }

                .artwork {
                  position: absolute;
                  cursor: pointer;
                  transition: all 0.3s ease;
                  border: 8px solid #d4c5b9;
                  background: linear-gradient(135deg, #e8ddd3 0%, #ddd2c8 100%);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #999;
                  font-size: 14px;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
                  font-style: italic;
                }

                .artwork:hover {
                  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.18);
                  transform: scale(1.02);
                }

                .artwork.selected {
                  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.25);
                }

                .navigation-bar {
                  padding: 1.5rem;
                  background: white;
                  border-top: 1px solid #e8ddd3;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 1.5rem;
                }

                .nav-button {
                  width: 44px;
                  height: 44px;
                  border: 1px solid #d0c5ba;
                  background: white;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transition: all 0.3s ease;
                  color: #1a1a1a;
                  border-radius: 2px;
                }

                .nav-button:hover {
                  background: #f5f0eb;
                  border-color: #b8aea3;
                }

                .nav-button:disabled {
                  opacity: 0.4;
                  cursor: not-allowed;
                }

                .room-counter {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.85rem;
                  color: #999;
                  text-transform: uppercase;
                  letter-spacing: 1px;
                  flex: 1;
                  text-align: center;
                }

                .info-panel {
                  width: 380px;
                  background: white;
                  border-left: 1px solid #e8ddd3;
                  padding: 2rem;
                  overflow-y: auto;
                  display: flex;
                  flex-direction: column;
                  animation: slideInRight 0.4s ease-out;
                }

                .info-panel-header {
                  display: flex;
                  justify-content: space-between;
                  align-items: flex-start;
                  margin-bottom: 2rem;
                }

                .info-panel-title {
                  flex: 1;
                }

                .close-btn {
                  background: none;
                  border: none;
                  cursor: pointer;
                  color: #999;
                  padding: 0;
                  width: 32px;
                  height: 32px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transition: color 0.2s;
                }

                .close-btn:hover {
                  color: #1a1a1a;
                }

                .artwork-heading {
                  font-family: 'Cormorant Garamond', serif;
                  font-size: 1.6rem;
                  font-weight: 600;
                  color: #1a1a1a;
                  margin: 0 0 0.5rem 0;
                  line-height: 1.3;
                }

                .artwork-meta {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.8rem;
                  color: #999;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                  margin-bottom: 1.5rem;
                  padding-bottom: 1.5rem;
                  border-bottom: 1px solid #e8ddd3;
                }

                .meta-line {
                  margin-bottom: 0.4rem;
                }

                .panel-section {
                  margin-bottom: 2rem;
                }

                .section-label {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.75rem;
                  color: #999;
                  text-transform: uppercase;
                  letter-spacing: 1px;
                  margin-bottom: 0.7rem;
                  font-weight: 600;
                }

                .narrative-text {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.95rem;
                  color: #666;
                  line-height: 1.7;
                  margin: 0;
                }

                .spec-row {
                  display: flex;
                  justify-content: space-between;
                  padding-bottom: 0.8rem;
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.9rem;
                  border-bottom: 1px solid #f0ebe5;
                }

                .spec-row:last-child {
                  border-bottom: none;
                  padding-bottom: 0;
                }

                .spec-label {
                  color: #999;
                  font-weight: 500;
                }

                .spec-value {
                  color: #1a1a1a;
                  font-weight: 500;
                }

                .room-info {
                  padding: 2rem;
                  background: #faf8f5;
                  border-bottom: 1px solid #e8ddd3;
                }

                .room-title {
                  font-family: 'Cormorant Garamond', serif;
                  font-size: 1.4rem;
                  font-weight: 600;
                  color: #1a1a1a;
                  margin: 0 0 0.5rem 0;
                }

                .room-location {
                  display: none;
                }

                .room-description {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.9rem;
                  color: #666;
                  line-height: 1.6;
                  margin: 0;
                }

                .empty-state {
                  color: #999;
                  text-align: center;
                  font-size: 0.95rem;
                  padding: 2rem;
                }

                .empty-state-title {
                  font-family: 'Poppins', sans-serif;
                  font-size: 1rem;
                  color: #999;
                  margin-bottom: 0.5rem;
                  font-weight: 500;
                }

                .empty-state-hint {
                  font-family: 'Poppins', sans-serif;
                  font-size: 0.85rem;
                  color: #ccc;
                }

                @keyframes slideInRight {
                  from {
                    opacity: 0;
                    transform: translateX(20px);
                  }
                  to {
                    opacity: 1;
                    transform: translateX(0);
                  }
                }

                @media (max-width: 1200px) {
                  .info-panel {
                    width: 320px;
                    padding: 1.5rem;
                  }

                  .artwork {
                    border-width: 6px;
                  }
                }

                @media (max-width: 768px) {
                  .gallery-container {
                    flex-direction: column;
                  }

                  .info-panel {
                    width: 100%;
                    border-left: none;
                    border-top: 1px solid #e8ddd3;
                    max-height: 40vh;
                  }

                  .room-view {
                    min-height: 60vh;
                  }
                }

                ::-webkit-scrollbar {
                  width: 6px;
                }

                ::-webkit-scrollbar-track {
                  background: #f5f0eb;
                }

                ::-webkit-scrollbar-thumb {
                  background: #d0c5ba;
                  border-radius: 3px;
                }

                ::-webkit-scrollbar-thumb:hover {
                  background: #b8aea3;
                }
              `}</style>

              <div className="gallery-container">
                <div className="viewer-section">
                  <div className="room-view">
                    <div className="room-background" style={{ backgroundColor: currentRoomData.bgColor }} />
                    <div className="room-canvas">
                      <div className="room-space">
                        {currentRoomData.artworks.map((art) => (
                          <div
                            key={art.id}
                            className={`artwork ${selectedArtwork?.id === art.id ? 'selected' : ''}`}
                            style={{
                              left: `${art.x}%`,
                              top: `${art.y}%`,
                              transform: 'translate(-50%, -50%)',
                              width: `${art.width}px`,
                              height: `${art.height}px`
                            }}
                            onClick={() => setSelectedArtwork(art)}
                          >
                            {art.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="navigation-bar">
                    <button
                      className="nav-button"
                      onClick={handlePrevRoom}
                      disabled={currentRoom === 0}
                      title="Previous space"
                    >
                      ← 
                    </button>
                    <div className="room-counter">
                      {currentRoom + 1} / {rooms.length}
                    </div>
                    <button
                      className="nav-button"
                      onClick={handleNextRoom}
                      disabled={currentRoom === rooms.length - 1}
                      title="Next space"
                    >
                      →
                    </button>
                  </div>
                </div>

                <div className="info-panel">
                  <div className="room-info">
                    <h2 className="room-title">{currentRoomData.name}</h2>
                    <div className="room-location">{currentRoomData.location}</div>
                    <p className="room-description">{currentRoomData.description}</p>
                  </div>

                  {selectedArtwork ? (
                    <>
                      <div className="info-panel-header">
                        <div className="info-panel-title">
                          <h3 className="artwork-heading">{selectedArtwork.title}</h3>
                          <div className="artwork-meta">
                            <div className="meta-line">Film: {selectedArtwork.film}</div>
                          </div>
                        </div>
                        <button
                          className="close-btn"
                          onClick={() => setSelectedArtwork(null)}
                          title="Close"
                        >
                          ✕
                        </button>
                      </div>

                      <div className="panel-section">
                        <div className="section-label">Installation Context</div>
                        <p className="narrative-text">{selectedArtwork.narrative}</p>
                      </div>

                      <div className="panel-section">
                        <div className="section-label">Specifications</div>
                        <div className="spec-row">
                          <span className="spec-label">Scale</span>
                          <span className="spec-value">{selectedArtwork.scale}</span>
                        </div>
                        <div className="spec-row">
                          <span className="spec-label">Placement</span>
                          <span className="spec-value">{selectedArtwork.placement}</span>
                        </div>
                      </div>
                    </>
                  ) : (
                    <div className="empty-state">
                      <div className="empty-state-title">Click on an artwork</div>
                      <div className="empty-state-hint">to explore installation details</div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VirtualGalleryWalk />);
    </script>
</body>
</html>
