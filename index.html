<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery Walkthrough</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
        #canvas { display: block; width: 100%; height: 100vh; }
        #info { position: absolute; bottom: 20px; left: 20px; color: #fff; font-size: 12px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 5px; max-width: 300px; }
        #panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.9); color: #fff; padding: 20px; border-radius: 8px; max-width: 350px; max-height: 400px; overflow-y: auto; display: none; border: 1px solid #666; }
        #panel h3 { margin-bottom: 10px; font-size: 18px; }
        #panel p { font-size: 12px; line-height: 1.6; margin-bottom: 8px; color: #ccc; }
        #panel .close { position: absolute; top: 10px; right: 10px; cursor: pointer; color: #999; font-size: 20px; }
        #panel .close:hover { color: #fff; }
        .spec { margin-top: 10px; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <div><strong>GALLERY WALKTHROUGH</strong></div>
        <div style="margin-top: 8px; font-size: 11px;">
            <div>WASD to move</div>
            <div>Mouse to look around</div>
            <div>Click photos for details</div>
        </div>
    </div>
    <div id="panel">
        <span class="close" onclick="closePanel()">×</span>

        <p id="panelNarrative"></p>
        <div class="spec"><strong>Scale:</strong> <span id="panelScale"></span></div>
        <div class="spec"><strong>Placement:</strong> <span id="panelPlacement"></span></div>
    </div>
