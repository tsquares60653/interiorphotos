<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; font-family: Arial; }
        #canvas { display: block; }
        #info { position: absolute; bottom: 20px; left: 20px; color: #0f0; font-size: 12px; }
        #panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.9); color: #fff; padding: 20px; border-radius: 8px; max-width: 350px; display: none; border: 1px solid #444; }
        .close { cursor: pointer; color: #999; float: right; font-size: 20px; }
        .close:hover { color: #fff; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <strong>3D GALLERY</strong><br>
        WASD = Move | Mouse = Look | Click = Details
    </div>
    <div id="panel">
        <span class="close" onclick="closePanel()">×</span>
        <h3 id="panelTitle">Photo</h3>
        <p id="panelText" style="font-size: 12px; margin-top: 10px;"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, frameGroup;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, -8);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            
            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(50, 50, 50);
            directional.castShadow = true;
            scene.add(directional);

            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(50, 15), wallMat);
            backWall.position.z = -5;
            backWall.position.y = 7.5;
            backWall.receiveShadow = true;
            scene.add(backWall);
            
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(50, 15), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.x = -12;
            leftWall.position.y = 7.5;
            leftWall.receiveShadow = true;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(50, 15), wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.x = 12;
            rightWall.position.y = 7.5;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            const hallLeft = new THREE.Mesh(new THREE.PlaneGeometry(50, 15), wallMat);
            hallLeft.rotation.y = Math.PI / 2;
            hallLeft.position.x = -12;
            hallLeft.position.z = 15;
            hallLeft.position.y = 7.5;
            hallLeft.receiveShadow = true;
            scene.add(hallLeft);
            
            const hallRight = new THREE.Mesh(new THREE.PlaneGeometry(50, 15), wallMat);
            hallRight.rotation.y = -Math.PI / 2;
            hallRight.position.x = 12;
            hallRight.position.z = 15;
            hallRight.position.y = 7.5;
            hallRight.receiveShadow = true;
            scene.add(hallRight);

            frameGroup = new THREE.Group();
            scene.add(frameGroup);

            createFrames();
            setupControls();
            animate();
        }

        function createFrames() {
            const photos = [
                { pos: [-6, 1.8, -5], size: [3, 3], title: "Photograph 1" },
                { pos: [-2, 1.8, -5], size: [3, 3], title: "Photograph 2" },
                { pos: [2, 1.8, -5], size: [3, 2.25], title: "Photograph 3" },
                { pos: [6, 1.8, -5], size: [3, 2.25], title: "Photograph 4" },
                { pos: [-4, 1.8, 15], size: [2.5, 2.5], title: "Photograph 5" },
                { pos: [4, 1.8, 15], size: [2.5, 2.5], title: "Photograph 6" }
            ];

            const textureLoader = new THREE.TextureLoader();
            const imageUrls = [
                "https://static.wixstatic.com/media/87f849_b94cd47f31f5438ba5fbdc9d100af677~mv2.jpg/v1/fit/w_800,h_800,q_90,enc_avif,quality_auto/87f849_b94cd47f31f5438ba5fbdc9d100af677~mv2.jpg",
                "https://static.wixstatic.com/media/87f849_d888367849c4489fac8410db48145bc4~mv2.jpg/v1/fit/w_800,h_800,q_90,enc_avif,quality_auto/87f849_d888367849c4489fac8410db48145bc4~mv2.jpg",
                "https://static.wixstatic.com/media/87f849_bca3730fab014b4db6a4b38b4fae72db~mv2_d_3637_2433_s_4_2.jpg/v1/fit/w_800,h_600,q_90,enc_avif,quality_auto/87f849_bca3730fab014b4db6a4b38b4fae72db~mv2_d_3637_2433_s_4_2.jpg",
                "https://static.wixstatic.com/media/87f849_75bae3de86454fb7bef6083f841747ca~mv2_d_3637_2433_s_4_2.jpg/v1/fit/w_800,h_600,q_90,enc_avif,quality_auto/87f849_75bae3de86454fb7bef6083f841747ca~mv2_d_3637_2433_s_4_2.jpg",
                "https://static.wixstatic.com/media/87f849_c23ab02f57a440b18896a5d51ccbd674~mv2.jpg/v1/fit/w_800,h_800,q_90,enc_avif,quality_auto/87f849_c23ab02f57a440b18896a5d51ccbd674~mv2.jpg",
                "https://static.wixstatic.com/media/87f849_cf951a58d76d4bd0bf22b362dd4dbf7c~mv2.jpg/v1/fit/w_800,h_800,q_90,enc_avif,quality_auto/87f849_cf951a58d76d4bd0bf22b362dd4dbf7c~mv2.jpg"
            ];

            photos.forEach((photo, i) => {
                const material = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.1 });
                textureLoader.load(imageUrls[i], (texture) => {
                    material.map = texture;
                    material.needsUpdate = true;
                });

                const geo = new THREE.PlaneGeometry(photo.size[0], photo.size[1]);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(...photo.pos);
                mesh.userData = { title: photo.title, index: i };
                mesh.castShadow = true;
                frameGroup.add(mesh);

                const frameGeo = new THREE.BoxGeometry(photo.size[0] + 0.2, photo.size[1] + 0.2, 0.1);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x8b7d6b });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.copy(mesh.position);
                frame.position.z -= 0.06;
                frameGroup.add(frame);
            });
        }

        const keys = {};
        const moveSpeed = 0.15;
        
        function setupControls() {
            document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

            let isLocked = false;
            document.addEventListener('click', () => {
                document.body.requestPointerLock();
            });
            
            document.addEventListener('pointerlockchange', () => {
                isLocked = !!document.pointerLockElement;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.setFromQuaternion(camera.quaternion);
                euler.rotateY(-e.movementX * 0.003);
                euler.rotateX(-e.movementY * 0.003);
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            window.addEventListener('click', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(frameGroup.children);
                
                if (hits.length > 0) {
                    const obj = hits[0].object;
                    if (obj.userData.title) {
                        document.getElementById('panelTitle').textContent = obj.userData.title;
                        document.getElementById('panelText').textContent = 'Keep exploring the gallery!';
                        document.getElementById('panel').style.display = 'block';
                    }
                }
            });
        }

        window.closePanel = function() {
            document.getElementById('panel').style.display = 'none';
        };

        function animate() {
            requestAnimationFrame(animate);

            const vec = new THREE.Vector3();
            if (keys['w']) vec.z -= 1;
            if (keys['s']) vec.z += 1;
            if (keys['a']) vec.x -= 1;
            if (keys['d']) vec.x += 1;
            
            vec.normalize();
            vec.applyQuaternion(camera.quaternion);
            camera.position.addScaledVector(vec, moveSpeed);
            camera.position.y = Math.max(1, camera.position.y);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
